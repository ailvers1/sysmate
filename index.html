<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>자산 QR 스캔</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17343d;font-family:Arial,'Malgun Gothic',sans-serif}main{max-width:520px;margin:auto;padding:24px 18px}section{background:#fff;padding:22px;border:1px solid #dce5e8;border-radius:16px;margin:18px 0}h1{font-size:27px}p{line-height:1.7;font-size:14px}button,input,a.action{font:inherit;padding:14px;border-radius:10px;width:100%;margin:8px 0}button,a.action{background:#086a5b;border:0;color:white;font-weight:bold;min-height:48px;cursor:pointer}button:disabled{opacity:.5}input{border:1px solid #bdced3}a.action{display:block;text-align:center;text-decoration:none}video{width:100%;max-height:50vh;background:#142b34;border-radius:12px}#message{white-space:pre-line;overflow-wrap:anywhere;background:#eaf3f0;padding:14px;border-radius:10px}[hidden]{display:none!important}.secondary{background:#e7edef;color:#25454d}</style></head>
<body><main><p>자산 실사 · QR 스캔</p><h1>라벨을 비춰 주세요.</h1><p>QR을 인식하면 소유자·부서·사용장소 화면으로 바로 이동합니다. 카메라 영상은 기기 안에서만 처리하며 전송하거나 저장하지 않습니다.</p>
<section><button id="start">카메라 열기</button><button id="stop" class="secondary" hidden>카메라 닫기</button><video id="video" autoplay muted playsinline hidden></video><p id="message" role="status" aria-live="polite">Chrome 또는 삼성 인터넷에서 이 페이지를 직접 열어 주세요.</p><a id="result" class="action" hidden>인식한 자산 열기</a></section>
<section><label for="code">관리번호 직접 입력</label><input id="code" placeholder="A-01-2019-0054" maxlength="80" autocomplete="off"><p>전체 관리번호 입력이 끝나면 자동으로 이동합니다.</p><button id="lookup">바로 조회</button></section></main>
<script src="jsQR.js"></script><script src="scanner.js?v=2"></script></body></html>
